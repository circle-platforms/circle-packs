name: Bug report
description: A pack or a check in circle-packs does not behave the way its SKILL.md or README says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Keep it short and concrete. Do not paste command trees, function contracts, device returns, credentials or business originals; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: State the bug in a few sentences. Paste the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows it, on synthetic samples.
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module and version
      description: The module id and the version from its manifest, for example "apv-case-review 0.1.3".
    validations:
      required: true
  - type: input
    id: hub
    attributes:
      label: circle-hub commit
      description: The commit of circle-hub the pack was installed on or tested against, if any.
