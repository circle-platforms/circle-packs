name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUB_DEPENDENCY_COMMIT: dc93c69826f73f16d2f20f7520ba4c6663d014ac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Manifest matches the files
        run: node tools/modules.ts check
      - name: Manifest and skill tests
        run: node --test tools/*.test.ts skills/*/tests/*.test.mjs templates/judgement-gate/scaffold/tests/*.test.mjs
      - name: Fetch the hub dependency set
        run: |
          git init ../circle-hub
          git -C ../circle-hub remote add origin https://github.com/circle-platforms/circle-hub
          git -C ../circle-hub fetch --depth 1 origin "$HUB_DEPENDENCY_COMMIT"
          git -C ../circle-hub checkout --detach FETCH_HEAD
          test "$(git -C ../circle-hub rev-parse HEAD)" = "$HUB_DEPENDENCY_COMMIT"
          cd ../circle-hub && npm ci --ignore-scripts
      - name: Product-line pack tests
        run: |
          ln -s ../circle-hub/node_modules node_modules
          node --experimental-strip-types --test 'products/*/tests/*.test.mjs'
      - name: Validate manifests with the hub schemas
        run: |
          git init ../circle-hub-schema
          git -C ../circle-hub-schema remote add origin https://github.com/circle-platforms/circle-hub
          git -C ../circle-hub-schema fetch --depth 1 origin main
          git -C ../circle-hub-schema checkout --detach FETCH_HEAD
          ln -s ../circle-hub/node_modules ../circle-hub-schema/node_modules
          HUB_ROOT=../circle-hub-schema node --experimental-strip-types tools/validate-with-hub.mjs
